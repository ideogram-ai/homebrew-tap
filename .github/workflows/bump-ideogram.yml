name: Bump ideogram

# ideogram-ai/ui publishes ideogram-cli to PyPI when a release is run by hand. This moves the
# formula to the newest release and its dependencies, and pushes to main only after the formula
# installs from source and passes its test.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: bump-ideogram
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Checks this repository out as the ideogram-ai/tap tap, in the workspace.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main
        # Pushing the bump to main needs a token.
        with:
          token: ${{ github.token }}

      - name: Compare the formula with PyPI
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sSL -o "$RUNNER_TEMP/pypi.json" -w '%{http_code}' https://pypi.org/pypi/ideogram-cli/json)"
          if [[ "$status" == 404 ]]; then
            echo "ideogram-cli is not on PyPI yet; nothing to bump."
            exit 0
          fi
          [[ "$status" == 200 ]]
          latest="$(jq -r .info.version "$RUNNER_TEMP/pypi.json")"
          current="$(brew info --json=v2 ideogram-ai/tap/ideogram | jq -r '.formulae[0].versions.stable')"
          echo "PyPI: $latest, formula: $current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$latest" != "$current" ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the formula at the new sdist
        if: steps.versions.outputs.bump == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          sdist="$(curl -fsSL "https://pypi.org/pypi/ideogram-cli/$VERSION/json" | jq -c '.urls[] | select(.packagetype == "sdist")')"
          url="$(jq -r .url <<< "$sdist")"
          sha256="$(jq -r .digests.sha256 <<< "$sdist")"
          filename="$(jq -r .filename <<< "$sdist")"
          # PyPI records which workflow uploaded each file. A release uploaded any other way, such
          # as with an owner's API token, has no matching record and never reaches brew users.
          curl -fsSL "https://pypi.org/integrity/ideogram-cli/$VERSION/$filename/provenance" \
            | jq -e '[.attestation_bundles[].publisher] | length > 0 and all(.repository == "ideogram-ai/ui" and .workflow == "ideogram-cli-pypi.yml" and .environment == "pypi")'
          sed -i '/Placeholder until the first PyPI release/d' Formula/ideogram.rb
          sed -i -E "0,/^  url \"/s|^  url \".*\"|  url \"$url\"|" Formula/ideogram.rb
          sed -i -E "0,/^  sha256 \"/s|^  sha256 \".*\"|  sha256 \"$sha256\"|" Formula/ideogram.rb
          # Homebrew holds back releases younger than a cooldown; this one is ours and just landed.
          brew update-python-resources --install-dependencies --ignore-main-package-cooldown \
            --exclude-packages certifi ideogram-ai/tap/ideogram
          git diff

      - name: Install from source and test
        if: steps.versions.outputs.bump == 'true'
        run: |
          brew install --build-from-source ideogram-ai/tap/ideogram
          brew test ideogram-ai/tap/ideogram
          brew audit --formula ideogram-ai/tap/ideogram

      - name: Push the bump
        if: steps.versions.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "ideogram $VERSION"
          git push origin HEAD:main

      # A failed bump leaves the formula on the old release; one open issue collects every failure.
      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Bump ideogram is failing"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The formula is stuck on its current release. Failed run: $RUN_URL"
          fi
